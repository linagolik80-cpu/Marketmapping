function bbox(keys){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;keys.forEach(k=>(D.G[k]||[]).forEach(([x,y,w,h])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+w);y1=Math.max(y1,y+h)}));
